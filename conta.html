<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:8080; frame-src https://www.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Área do Cliente | DITEC Assistência Técnica</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><rect width='36' height='36' rx='9' fill='%230047AB'/><text x='18' y='25' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='16' fill='white'>DT</text></svg>" />
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="dash-header">
  <div class="dash-header__inner">
    <a href="index.html" class="logo" aria-label="DITEC — Página inicial">
      <svg width="34" height="34" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="36" height="36" rx="9" fill="#0047AB"/>
        <path d="M10 12h5c3.314 0 6 2.686 6 6s-2.686 6-6 6h-5V12z" fill="white"/>
        <rect x="23" y="12" width="3" height="12" rx="1.5" fill="white"/>
      </svg>
      <span class="logo__text">DI<span>TEC</span></span>
    </a>
    <div style="display:flex;align-items:center;gap:10px;">
      <a href="index.html" class="btn btn--outline btn--sm">← Voltar ao site</a>
      <button class="btn btn--primary btn--sm" id="logoutBtn" type="button" hidden>Sair</button>
    </div>
  </div>
</header>

<main class="dash-main">
  <div class="container">

    <!-- ===== ESTADO: NÃO LOGADO ===== -->
    <section id="guestView" hidden>
      <div class="dash-auth-wrap">
        <h1 style="font-size:1.4rem;font-weight:700;margin-bottom:6px;">Acesse sua conta</h1>
        <p style="color:var(--text-light);font-size:.9rem;margin-bottom:22px;">Entre ou cadastre-se para acompanhar seus agendamentos e Ordens de Serviço.</p>

        <div class="dash-tabs" style="margin-bottom:20px;border-bottom:1px solid var(--border);">
          <button class="dash-tab active" id="gTabLogin" type="button">Entrar</button>
          <button class="dash-tab" id="gTabCadastro" type="button">Criar Conta</button>
        </div>

        <form id="gLoginForm" class="modal-form" novalidate>
          <div class="form-group"><label class="form-label" for="gLoginEmail">E-mail</label><input type="email" id="gLoginEmail" class="input" required /></div>
          <div class="form-group"><label class="form-label" for="gLoginSenha">Senha</label><input type="password" id="gLoginSenha" class="input" required /></div>
          <button type="submit" class="btn btn--primary btn--full">Entrar</button>
        </form>

        <form id="gCadastroForm" class="modal-form" novalidate hidden>
          <div class="form-group"><label class="form-label" for="gCadNome">Nome completo</label><input type="text" id="gCadNome" class="input" required /></div>
          <div class="form-group"><label class="form-label" for="gCadEmail">E-mail</label><input type="email" id="gCadEmail" class="input" required /></div>
          <div class="form-group"><label class="form-label" for="gCadTel">Telefone / WhatsApp</label><input type="tel" id="gCadTel" class="input" required /></div>
          <div class="form-group"><label class="form-label" for="gCadSenha">Senha</label><input type="password" id="gCadSenha" class="input" placeholder="Mínimo 6 caracteres" required /></div>
          <div class="form-group"><label class="form-label" for="gCadSenha2">Confirmar senha</label><input type="password" id="gCadSenha2" class="input" required /></div>
          <button type="submit" class="btn btn--primary btn--full">Criar Conta</button>
        </form>
      </div>
    </section>

    <!-- ===== ESTADO: LOGADO ===== -->
    <section id="dashView" hidden>
      <div class="dash-welcome">
        <h1 id="welcomeTitle">Olá! 👋</h1>
        <p>Acompanhe seus dados, agendamentos e Ordens de Serviço.</p>
      </div>

      <!-- CARTÃO DE PERFIL / DADOS DE CADASTRO -->
      <div class="profile-card">
        <div class="profile-card__top">
          <div class="profile-avatar" id="profileAvatar">--</div>
          <div class="profile-info">
            <h2 class="profile-name" id="profileName">—</h2>
            <p class="profile-email" id="profileEmailDisplay">—</p>
            <span class="profile-pill" id="profileSince">Cliente desde —</span>
          </div>
          <button class="btn btn--outline btn--sm profile-edit-btn" id="editDataBtn" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Editar dados
          </button>
        </div>

        <form id="dataForm" class="profile-form" novalidate>
          <div class="profile-form__grid">
            <div class="form-group">
              <label class="form-label" for="dNome">Nome completo</label>
              <input type="text" id="dNome" class="input" disabled />
            </div>
            <div class="form-group">
              <label class="form-label" for="dEmail">E-mail <span class="profile-form__hint">(não editável)</span></label>
              <input type="email" id="dEmail" class="input" disabled />
            </div>
            <div class="form-group">
              <label class="form-label" for="dTel">Telefone / WhatsApp</label>
              <input type="tel" id="dTel" class="input" disabled />
            </div>
            <div class="form-group">
              <label class="form-label" for="dEndereco">Endereço</label>
              <input type="text" id="dEndereco" class="input" disabled placeholder="Rua, número, complemento" />
            </div>
            <div class="form-group">
              <label class="form-label" for="dBairro">Bairro</label>
              <input type="text" id="dBairro" class="input" disabled />
            </div>
            <div class="form-group">
              <label class="form-label" for="dCidade">Cidade</label>
              <input type="text" id="dCidade" class="input" disabled />
            </div>
            <div class="form-group">
              <label class="form-label" for="dUf">UF</label>
              <input type="text" id="dUf" class="input" disabled maxlength="2" style="text-transform:uppercase;" />
            </div>
            <div class="form-group">
              <label class="form-label" for="dCep">CEP</label>
              <input type="text" id="dCep" class="input" disabled maxlength="9" />
            </div>
          </div>
          <button type="submit" class="btn btn--primary" id="saveDataBtn" hidden>Salvar alterações</button>
        </form>
      </div>

      <div class="dash-grid">
        <!-- RASTREAMENTO RÁPIDO DE OS -->
        <div class="dash-card">
          <div class="dash-card__title">Rastrear Ordem de Serviço</div>
          <div class="modal-form">
            <input type="text" id="osInputConta" class="input" placeholder="Ex: DITEC-2026-000001" maxlength="20" />
            <button class="btn btn--primary btn--full" id="osSearchConta" type="button">Rastrear</button>
            <div id="osResultConta"></div>
          </div>
        </div>

        <!-- MEUS AGENDAMENTOS -->
        <div class="dash-card">
          <div class="dash-card__title">Meus agendamentos <span class="profile-pill" id="agendamentosCount" style="margin-left:4px;">0</span></div>
          <div id="agendamentosList"></div>
        </div>
      </div>
    </section>

  </div>
</main>

<script src="dashboard-shared.js"></script>
<script src="conta.js"></script>
</body>
</html>
