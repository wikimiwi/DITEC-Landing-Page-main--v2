# ============================================================
# DITEC Assistencia Tecnica — configuracao do backend
# NUNCA coloque valores reais aqui. Tudo vem de variaveis de
# ambiente (veja o .env.example na raiz do backend).
# ============================================================
server:
  port: 8080
  error:
    # Defesa em profundidade: o GlobalExceptionHandler ja' cobre os erros da
    # aplicacao, mas isso garante que nem a pagina de erro padrao do Spring
    # Boot vaze stacktrace, mensagem interna ou detalhes da excecao.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: ditec-assistencia-backend

  profiles:
    active: ${DITEC_PROFILE:dev}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ditec_assistencia?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:ditec_user}
    # Sem valor padrao de proposito: se DB_PASSWORD nao for definida, o Spring Boot
    # falha ao subir (em vez de conectar silenciosamente com uma senha adivinhavel
    # como "changeme"). Mesma logica de fail-fast do JWT_SECRET (ver JwtUtil).
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # O schema e' controlado 100% pelo Flyway (V1__schema.sql) — 'none'
      # em vez de 'validate' de proposito: o Hibernate as vezes mapeia tipos
      # (ex: boolean -> BIT vs TINYINT(1)) de um jeito que diverge de um DDL
      # escrito a mao mesmo quando os dados estao corretos, gerando falso
      # erro no startup. O Flyway ja e' a fonte da verdade do schema; se uma
      # entidade JPA realmente estiver fora de sincronia com uma tabela, isso
      # aparece na hora (400/500) ao usar o endpoint correspondente, o que e'
      # facil de notar durante os testes manuais.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo
    show-sql: ${DITEC_SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    time-zone: America/Sao_Paulo

# ------------------------------------------------------------
# Configuracoes proprias da aplicacao DITEC
# ------------------------------------------------------------
ditec:
  seed:
    # Popula dados de desenvolvimento (admin/cliente/tecnico/servico/
    # agendamento/OS de teste) no primeiro start. So roda se o banco
    # ainda nao tiver nenhum ADMINISTRADOR cadastrado.
    enabled: ${DITEC_SEED_ENABLED:true}
  ratelimit:
    # Protecao contra forca bruta/spam (login, cadastro, chatbot,
    # agendamento, avaliacao) — ver RateLimitFilter. Desligado apenas
    # no perfil "test" (application-test.yml), pra nao interferir nos
    # testes automatizados.
    enabled: ${DITEC_RATELIMIT_ENABLED:true}
    # true SOMENTE se a API estiver atras de um proxy reverso confiavel (ex.: Render).
    trust-forwarded-for: ${DITEC_TRUST_PROXY:false}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${DITEC_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501}}
  # Chatbot: Google Gemini API (chave so' no backend; vazia = respostas automaticas)
  gemini:
    api-key: ${GEMINI_API_KEY:}
    api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
    # gemini-2.5-flash (pedido inicial) foi testado em 09/11/2026: "no longer available to new users" (404).
    # Escolha documentada: gemini-3.5-flash-lite (estavel, medido com media de 1,1 s). Troque por GEMINI_MODEL.
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    # usado se o modelo principal nao existir/nao estiver liberado para a conta
    fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-2.5-flash-lite}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:400}
    temperature: ${GEMINI_TEMPERATURE:0.6}
    thinking-level: ${GEMINI_THINKING_LEVEL:LOW}
    max-retries: ${GEMINI_MAX_RETRIES:2}
    retry-backoff-ms: ${GEMINI_RETRY_BACKOFF_MS:500}
    connect-timeout-ms: ${GEMINI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${GEMINI_READ_TIMEOUT_MS:15000}
  regras:
    horario-inicio: 07:00
    horario-fim: 20:00
    garantia-dias: 90
    desconto-pagamento-vista: 0.05

# Health check para a hospedagem (GET /actuator/health -> {"status":"UP"}).
# So' o "health" e' exposto, sem detalhes internos.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.ditec.assistencia: ${DITEC_LOG_LEVEL:INFO}
